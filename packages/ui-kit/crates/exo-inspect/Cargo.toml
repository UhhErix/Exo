[package]
name = "exo-inspect"
description = "What Exo's GPUI elements are (role, name, state, bounds), for test suites and screen readers. No Launcher dependency."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
# The in-app test server (src/server.rs). Off in a shipped build.
testkit = []

[dependencies]
gpui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6.2"
futures = "0.3.34"
accesskit = "0.25.2"
accesskit_windows = "0.35.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
  "Win32_System_IO", "Win32_System_Pipes", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
] }
