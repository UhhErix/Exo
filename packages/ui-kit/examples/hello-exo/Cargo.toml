# An app outside the kit's workspace, the way an app repo depends on it: exo-design by path, gpui patched to the kit's copy.
# Build with CARGO_TARGET_DIR pointing at the kit's target/ to reuse its artifacts (same profile below, same gpui).
[package]
name = "hello-exo"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
exo-design = { path = "../../crates/exo-design" }
gpui = "=0.2.2"

[patch.crates-io]
gpui = { path = "../../vendor/gpui" }

[profile.dev.package."*"]
opt-level = 2
