# Exo's native UI building blocks, shared by Exo Launcher, Exo Cinema and Exo Browser. See README.md.
[workspace]
resolver = "3"
members = ["crates/exo-design", "crates/exo-inspect"]
exclude = ["vendor", "examples/hello-exo"]

# gpui 0.2.2 from crates.io with the changes listed in vendor/gpui/PATCHES.md.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gpui = "=0.2.2"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
debug = false

[profile.dev.package."*"]
opt-level = 2
