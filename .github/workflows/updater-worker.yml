name: Updater Worker

on:
  pull_request:
    paths:
      - 'workers/exo-updates/**'
      - '.github/workflows/updater-worker.yml'
  push:
    branches: [main]
    paths:
      - 'workers/exo-updates/**'
      - '.github/workflows/updater-worker.yml'

permissions:
  contents: read

jobs:
  test:
    name: Updater Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test workers/exo-updates/test/worker.test.mjs
