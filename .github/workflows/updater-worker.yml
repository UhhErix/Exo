name: Updater Worker

on:
  pull_request:
    paths:
      - 'workers/exo-updates/**'
      - '.github/workflows/updater-worker.yml'
  push:
    branches: [main]
    paths:
      - 'workers/exo-updates/**'
      - '.github/workflows/updater-worker.yml'

permissions:
  contents: read

jobs:
  test:
    name: Updater Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
      - run: node --test workers/exo-updates/test/worker.test.mjs
