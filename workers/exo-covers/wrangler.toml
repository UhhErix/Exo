name = "exo-covers"
main = "src/worker.js"
compatibility_date = "2026-08-22"
workers_dev = false
preview_urls = false
send_metrics = false

[[ratelimits]]
name = "COVER_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "COVER_LOOKUP_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[kv_namespaces]]
binding = "COVERS"
id = "00000000000000000000000000000000"

[[ratelimits]]
name = "COVER_STORE_ADDRESS_LIMIT"
namespace_id = "1004"
simple = { limit = 50, period = 60 }

[[ratelimits]]
name = "COVER_STORE_LIMIT"
namespace_id = "1005"
simple = { limit = 300, period = 60 }
