name = "exo-site"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
send_metrics = false

# No logs, as on the update address.
[observability]
enabled = false

[assets]
directory = "../../site/public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/download/*", "/launcher/changelog", "/cinema/changelog", "/source/*"]

# A Worker can't fetch another on the same zone (error 1042), so the update address is a binding.
[vars]
# The update address's origin: the Changelog pages read /v1/<app>/changelog from it (through the UPDATES binding).
UPDATES_ORIGIN = "https://updates.example.com"
DISCORD_INVITE = ""

[[r2_buckets]]
binding = "SOURCE"
bucket_name = "replace-with-source-bucket"

[[services]]
binding = "UPDATES"
service = "exo-updates"
